<app-navbar></app-navbar>
<app-login-modal></app-login-modal>

<div class="app-layout">
  <!-- Main Content Area: Switches between Form and Markdown View -->
  <main class="main-content">

    <!-- Show View Component if an idea is selected, otherwise show the entry Form -->
    <app-ideia-view 
      *ngIf="selectedIdeia; else formTemplate" 
      [ideiaContent]="selectedIdeia" 
      (closeView)="closeView()"
      (deleteRequested)="requestDeleteIdea($event)"
      >
    </app-ideia-view>

    <ng-template #formTemplate>
      <app-ideia (ideiaSubmitted)="onAddIdeia($event)"></app-ideia>
    </ng-template>
  </main>

  <!-- Left Sidebar List -->
  <app-ideia-list 
    [ideias]="ideias()"
    [hasMore]="hasMoreIdeas()"
    [isLoading]="isLoadingIdeas()"
    [sortBy]="ideaSort()"
    (ideiaSelected)="viewIdeia($event)"
    (loadMore)="loadMoreIdeas()"
    (sortChanged)="changeIdeaSort($event)"
    (deleteRequested)="requestDeleteIdea($event)"
  >
  </app-ideia-list>
</div>

@if (ideiaToDelete(); as ideia) {
  <app-confirm-delete-modal
    [ideaTitle]="ideia.title || 'Untitled idea'"
    [isDeleting]="isDeletingIdea()"
    (confirmed)="confirmDeleteIdea()"
    (cancelled)="cancelDeleteIdea()"
  />
}
